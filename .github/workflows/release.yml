name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.96.1

jobs:
  build:
    # Linux x86_64 only — matches this project's actual dev/test environment
    # (RALPH_SPEC.md §3/§14.1's single-workstation target); no cross-platform
    # matrix for platforms nobody here can test.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/ralph "dist/ralph-${{ github.ref_name }}-x86_64-linux"
          chmod +x "dist/ralph-${{ github.ref_name }}-x86_64-linux"

      - name: Create release and upload binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
